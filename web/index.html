<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root{--sky:#0E1430;--fog:#1B2350;--gold:#F2C14E;--danger:#FF5A5F;--text:#F5F1E6;--lamp:#FFB347}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:system-ui,"Segoe UI",sans-serif;color:var(--text);user-select:none}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;font-size:18px;text-shadow:0 1px 4px #000a}
  #flames{top:12px;left:16px;font-size:24px;letter-spacing:2px}
  #clock{top:10px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  #clock.low{color:var(--danger);animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #right{top:12px;right:16px;text-align:right;line-height:1.4}
  #right b{color:var(--gold)}
  #cells{bottom:46px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  #cells i{width:20px;height:20px;border-radius:50%;border:2px solid #FFE58A66;background:#0006}
  #cells i.on{background:radial-gradient(#FFF6C2,#FFE58A);box-shadow:0 0 8px #FFE58A}
  #prompt{bottom:84px;left:0;right:0;text-align:center;color:var(--gold);font-weight:600;display:none}
  #cds{bottom:40px;right:20px;display:flex;gap:12px}
  .cd{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;font-size:12px;font-weight:700;border:2px solid var(--gold);background:#0008;position:relative;overflow:hidden}
  .cd .fill{position:absolute;left:0;right:0;bottom:0;background:#F2C14E55}
  .cd span{position:relative}
  .cd.off{border-color:#888;color:#aaa}
  #arrow{position:fixed;width:0;height:0;pointer-events:none;display:none;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:28px solid var(--lamp);filter:drop-shadow(0 0 6px #FFB347)}
  #charmbar{top:56px;left:16px;color:var(--danger);display:none}
  #toast{top:96px;left:0;right:0;text-align:center;font-size:20px;opacity:0;transition:opacity .3s}
  #windwarn{top:100px;left:0;right:0;text-align:center;color:#8FA3B8;display:none}
  #vignette{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px var(--danger)}
  .tarrow{position:fixed;width:0;height:0;pointer-events:none;display:none;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:20px solid var(--danger);filter:drop-shadow(0 0 5px var(--danger))}
  #debug{bottom:6px;left:8px;font-size:12px;opacity:.6}
  #help{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:12px;opacity:.55;pointer-events:none}
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0E1430dd;text-align:center;gap:10px;padding:20px}
  .screen h1{font-size:46px;margin:0;color:var(--gold)}
  .screen h2{margin:0;font-size:28px}
  .screen p{max-width:560px;line-height:1.5;margin:4px 0}
  .screen button{font-size:19px;padding:10px 26px;border:0;border-radius:8px;background:var(--lamp);color:#2a1a05;cursor:pointer;min-width:230px}
  .screen button.sec{background:#2a3566;color:var(--text)}
  .screen button:hover{filter:brightness(1.12)}
  .row{display:flex;gap:10px;align-items:center}
  input[type=range]{width:220px}
</style>
</head>
<body>
<div class="hud" id="flames"></div>
<div class="hud" id="clock"></div>
<div class="hud" id="right"></div>
<div class="hud" id="cells"></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="cds"><div class="cd" id="cdDash"><div class="fill"></div><span>Shift<br>Lướt</span></div><div class="cd" id="cdPulse"><div class="fill"></div><span>F<br>Tỏa Sáng</span></div></div>
<div class="hud" id="charmbar"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="windwarn">🍃 Gió mạnh sắp tới…</div>
<div class="hud" id="debug"></div>
<div id="arrow"></div>
<div id="vignette"></div>
<div class="hud" id="warnicon" style="top:60px;left:0;right:0;text-align:center;font-size:34px;display:none;color:var(--danger)">⚠</div>
<div id="threats"></div>
<div id="help">WASD di chuyển · Space nhảy · Shift lướt · E nạp ánh sáng · F Tỏa Sáng · ←/→ hoặc kéo chuột xoay camera · Esc/P tạm dừng</div>
<div class="screen" id="screen"></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module" src="/web/main.mjs"></script>
</body>
</html>
